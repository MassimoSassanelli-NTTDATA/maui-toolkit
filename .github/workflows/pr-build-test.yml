name: PR Build and Test

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        shell: pwsh
        run: |
          dotnet workload install maui

      - name: Restore (with log)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          dotnet restore src/Ndbs.MauiToolkit.All.slnx *>&1 | Tee-Object -FilePath artifacts/restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build (with log)
        shell: pwsh
        run: |
          dotnet build src/Ndbs.MauiToolkit.All.slnx -c Release --no-restore *>&1 | Tee-Object -FilePath artifacts/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test (with trx and log)
        shell: pwsh
        run: |
          dotnet test tests/Ndbs.MauiToolkit.Tests/Ndbs.MauiToolkit.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory artifacts *>&1 | Tee-Object -FilePath artifacts/test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare coverage.xml placeholder
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/coverage.xml)) {
            "<coverage generated=\"false\" note=\"No coverage collector configured.\" />" | Set-Content -Path artifacts/coverage.xml -Encoding utf8
          }

      - name: Prepare publish.log placeholder
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/publish.log)) {
            "Publish not executed in PR validation workflow." | Set-Content -Path artifacts/publish.log -Encoding utf8
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-validation-artifacts
          path: |
            artifacts/test-results.trx
            artifacts/coverage.xml
            artifacts/build.log
            artifacts/restore.log
            artifacts/publish.log
            artifacts/test.log
